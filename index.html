<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="flor.png" type="image/png">
  <title>Galaxia de Flores Amarillas</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      overflow: hidden;
    }

    *{
        cursor: url('flor.png'), auto !important;

    }

    #container {
      width: 100vw;
      height: 100vh;
      background: #000000;
      position: fixed;
      top: 0;
      left: 0;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #modalCarta {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #modalCarta.show {
      display: flex;
      opacity: 1;
    }

    #cartaImg {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(255, 204, 0, 0.6);
      object-fit: contain;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #modalMensaje {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #modalMensaje.show {
      display: flex;
      opacity: 1;
    }
    #tarjetaMensaje {
      max-width: 340px;
      width: 85vw;
      padding: 38px 28px;
      text-align: center;
      background: linear-gradient(180deg, #fff6d8, #ffe08a);
      border: 2px solid #ffb703;
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(255, 204, 0, 0.6);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #textoMensaje {
      font-family: Georgia, serif;
      font-style: italic;
      font-weight: bold;
      font-size: 26px;
      color: #6b4c00;
      text-shadow: 0 1px 0 rgba(255,255,255,0.4);
      margin-bottom: 22px;
    }
    #cerrarMensaje {
      padding: 10px 30px;
      font-size: 16px;
      font-weight: bold;
      color: #333;
      background-color: #ffcc00;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
      transition: transform 0.2s ease;
    }
    #cerrarMensaje:active { transform: scale(0.95); }

    #cerrarModal {
      margin-top: 20px;
      padding: 10px 30px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
      background-color: #ffcc00;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    #cerrarModal:active {
      transform: scale(0.95);
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    #inicio {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #3a2415 0%, #1a0f08 70%, #120a05 100%);
      transition: opacity 0.9s ease;
    }
    #inicio.oculto {
      opacity: 0;
      pointer-events: none;
    }
    #girasolInicio {
      width: 260px;
      max-width: 70vw;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 22px rgba(255, 204, 0, 0.7)) drop-shadow(0 0 45px rgba(255, 170, 0, 0.4));
      animation: girasolPulso 2.4s ease-in-out infinite;
    }
    @keyframes girasolPulso {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    #inicio p {
      margin-top: 22px;
      color: #ffe9b0;
      font-family: Arial, sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 0 10px rgba(255, 204, 0, 0.55);
      letter-spacing: 3px;
    }
  </style>
</head>

<body>
  <div id="container"></div>

  <div id="inicio">
    <img id="girasolInicio" src="6.png" alt="Ramo de girasoles">
    <p>EMPEZAR VIAJE</p>
  </div>

  <div id="modalCarta">
    <img id="cartaImg" src="" alt="Carta">
    <button id="cerrarModal">Cerrar</button>
  </div>

  <div id="modalMensaje">
    <div id="tarjetaMensaje">
      <p id="textoMensaje"></p>
      <button id="cerrarMensaje">Cerrar</button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.0015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 4, 18); 

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.getElementById('container').appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = false; 
    controls.enabled = false; 

    const textureLoader = new THREE.TextureLoader();
    THREE.Cache.enabled = true;
    const textureCache = {};
    function getTexture(url) {
      if (!textureCache[url]) {
        const tex = textureLoader.load(url);
        tex.colorSpace = THREE.SRGBColorSpace;
        textureCache[url] = tex;
      }
      return textureCache[url];
    }

    const flowerExplosionGroup = new THREE.Group();
    scene.add(flowerExplosionGroup);
    const explFlowers = [];
    const fUrls = ["flor1.png", "flor2.png", "flor3.png", "flor4.png", "flor5.png", "flor6.png", "flor7.png"];

    fUrls.forEach(url => {
      for(let k=0; k<15; k++) {
        const tex = getTexture(url);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));

        sprite.position.set(
          (Math.random() - 0.5) * 150,
          (Math.random() - 0.5) * 150,
          - (Math.random() * 400) 
        );
        
        const s = Math.random() * 2.5 + 1.5;
        sprite.scale.set(s, s, 1);
        
        flowerExplosionGroup.add(sprite);
        explFlowers.push(sprite);
      }
    });

    // Mensajes que también vuelan hacia la cámara durante el viaje inicial
    const textExplosionGroup = new THREE.Group();
    scene.add(textExplosionGroup);
    const explTextos = [];
    const mensajesVuelo = [
      "Eres especial 💛", "Mi persona favorita 🌻", "Contigo todo es mejor 💛",
      "Por siempre 🌻", "Gracias por existir 💛", "Flores para ti 🌼",
      "Feliz día 🌻", "Un sol para ti 💛", "Eres única 🌼", "Te quiero 💛"
    ];
    mensajesVuelo.forEach(msg => {
      for (let k = 0; k < 4; k++) {
        const sprite = createSmallTextSprite(msg);
        sprite.position.set(
          (Math.random() - 0.5) * 150,
          (Math.random() - 0.5) * 150,
          - (Math.random() * 400)
        );
        const s = Math.random() * 1.3 + 1.6;
        sprite.scale.set(s * 4.2, s * 0.85, 1);
        textExplosionGroup.add(sprite);
        explTextos.push(sprite);
      }
    });

    // Líneas de estela tipo "velocidad de la luz" durante el viaje inicial
    const estelaCount = 150;
    const estelaPos = new Float32Array(estelaCount * 2 * 3);
    function initEstela(i, lejos) {
      const x = (Math.random() - 0.5) * 220;
      const y = (Math.random() - 0.5) * 220;
      const z = lejos ? -200 - Math.random() * 200 : -Math.random() * 400;
      const len = 3 + Math.random() * 9;
      estelaPos[i * 6 + 0] = x; estelaPos[i * 6 + 1] = y; estelaPos[i * 6 + 2] = z;
      estelaPos[i * 6 + 3] = x; estelaPos[i * 6 + 4] = y; estelaPos[i * 6 + 5] = z - len;
    }
    for (let i = 0; i < estelaCount; i++) initEstela(i, false);
    const estelaGeom = new THREE.BufferGeometry();
    estelaGeom.setAttribute('position', new THREE.BufferAttribute(estelaPos, 3));
    const estelaMat = new THREE.LineBasicMaterial({
      color: 0xffe9a0, transparent: true, opacity: 0.55,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const estelas = new THREE.LineSegments(estelaGeom, estelaMat);
    scene.add(estelas);

    function actualizarEstelas(speed) {
      if (speed <= 0.1) return;
      const pos = estelas.geometry.attributes.position.array;
      for (let i = 0; i < estelaCount; i++) {
        pos[i * 6 + 2] += speed;
        pos[i * 6 + 5] += speed;
        if (pos[i * 6 + 2] > 50) initEstela(i, true);
      }
      estelas.geometry.attributes.position.needsUpdate = true;
    }

    const galaxyGroup = new THREE.Group();
    scene.add(galaxyGroup);
    galaxyGroup.visible = false; 
    galaxyGroup.scale.set(0, 0, 0); 

    function createGlowMaterial(color, size = 128) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const context = canvas.getContext('2d');
      const gradient = context.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
      gradient.addColorStop(0, color);
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      context.fillStyle = gradient;
      context.fillRect(0, 0, size, size);
      return new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    }

    const centralGlow = createGlowMaterial('rgba(255, 230, 100, 0.8)', 256);
    centralGlow.scale.set(8, 8, 1);
    galaxyGroup.add(centralGlow); 

    for (let i = 0; i < 15; i++) {
      const hue = 40 + Math.random() * 25;
      const nebula = createGlowMaterial(`hsla(${hue}, 100%, 50%, 0.3)`, 256);
      nebula.scale.set(10 + Math.random() * 20, 10 + Math.random() * 20, 1);
      nebula.position.set((Math.random() - 0.5) * 40, (Math.random() - 0.5) * 40, (Math.random() - 0.5) * 40);
      galaxyGroup.add(nebula); 
    }

    const galaxyParams = {
      count: 100000, arms: 4, radius: 10, spin: 2, randomness: 0.3, randomnessPower: 3,
      insideColor: new THREE.Color(0xffcc00), 
      outsideColor: new THREE.Color(0xffff66) 
    };

    const positions = new Float32Array(galaxyParams.count * 3);
    const colors = new Float32Array(galaxyParams.count * 3);

    for (let i = 0; i < galaxyParams.count; i++) {
      const i3 = i * 3;
      const radius = Math.pow(Math.random(), galaxyParams.randomnessPower) * galaxyParams.radius;
      const branchAngle = ((i % galaxyParams.arms) / galaxyParams.arms) * Math.PI * 2;
      const totalAngle = branchAngle + (radius * galaxyParams.spin);
      
      positions[i3]     = Math.cos(totalAngle) * radius + (Math.random() - 0.5) * galaxyParams.randomness * radius;
      positions[i3 + 1] = (Math.random() - 0.5) * galaxyParams.randomness * radius * 0.5;
      positions[i3 + 2] = Math.sin(totalAngle) * radius + (Math.random() - 0.5) * galaxyParams.randomness * radius;
      
      const mixedColor = galaxyParams.insideColor.clone();
      mixedColor.lerp(galaxyParams.outsideColor, radius / galaxyParams.radius);
      mixedColor.multiplyScalar(0.7 + 0.3 * Math.random());
      colors[i3] = mixedColor.r; colors[i3 + 1] = mixedColor.g; colors[i3 + 2] = mixedColor.b;
    }

    const galaxyGeom = new THREE.BufferGeometry();
    galaxyGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    galaxyGeom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const galaxyMat = new THREE.PointsMaterial({ size: 0.02, vertexColors: true, depthWrite: false, blending: THREE.AdditiveBlending });
    
    const galaxy = new THREE.Points(galaxyGeom, galaxyMat);
    galaxyGroup.add(galaxy);

 
    const starGeom = new THREE.BufferGeometry();
    const starCount = 8000;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      starPositions[i * 3] = (Math.random() - 0.5) * 400;
      starPositions[i * 3 + 1] = (Math.random() - 0.5) * 400;
      starPositions[i * 3 + 2] = (Math.random() - 0.5) * 400;
    }
    starGeom.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true });
    const stars = new THREE.Points(starGeom, starMat);
    scene.add(stars);

  
    const cometGroup = new THREE.Group();
    scene.add(cometGroup);
    const comets = [];

    function createCometMesh() {
      const group = new THREE.Group();
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.15, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffffee })
      );
      group.add(head);
      
      const tailGeo = new THREE.ConeGeometry(0.2, 8, 8);
      tailGeo.translate(0, -4, 0);
      const tail = new THREE.Mesh(
        tailGeo,
        new THREE.MeshBasicMaterial({ 
          color: 0xffff88, 
          transparent: true, opacity: 0.4, 
          blending: THREE.AdditiveBlending, depthWrite: false 
        })
      );
      group.add(tail);
      return group;
    }

    function resetComet(comet) {
      comet.position.set(
        (Math.random() - 0.5) * 300,
        150 + Math.random() * 100, 
        (Math.random() - 0.5) * 300
      );
      comet.userData.velocity = new THREE.Vector3(
        (Math.random() - 0.5) * 3,
        - (Math.random() * 2 + 2),
        (Math.random() - 0.5) * 3
      ).normalize().multiplyScalar(Math.random() * 3 + 2); 
      comet.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), comet.userData.velocity.clone().normalize());
    }

    for(let i = 0; i < 12; i++) { 
      const c = createCometMesh();
      resetComet(c);
      cometGroup.add(c);
      comets.push(c);
    }


    const heartCount = 15000;
    const hPos = new Float32Array(heartCount * 3);
    const hCol = new Float32Array(heartCount * 3);
    for(let i=0; i < heartCount; i++) {
      const t = Math.PI * 2 * Math.random();
      let x = 16 * Math.pow(Math.sin(t), 3);
      let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      let z = (Math.random() - 0.5) * 3;
      
      const scale = 0.15, noise = 0.4;
      hPos[i*3] = x * scale + (Math.random() - 0.5) * noise;
      hPos[i*3+1] = y * scale + (Math.random() - 0.5) * noise;
      hPos[i*3+2] = z * scale + (Math.random() - 0.5) * noise;

      const mixedColor = galaxyParams.insideColor.clone();
      mixedColor.lerp(galaxyParams.outsideColor, Math.random());
      hCol[i*3] = mixedColor.r; hCol[i*3+1] = mixedColor.g; hCol[i*3+2] = mixedColor.b;
    }
    const heartGeom = new THREE.BufferGeometry();
    heartGeom.setAttribute('position', new THREE.BufferAttribute(hPos, 3));
    heartGeom.setAttribute('color', new THREE.BufferAttribute(hCol, 3));
    const heartParticles = new THREE.Points(heartGeom, galaxyMat);
    heartParticles.position.set(0, 4, 0);
    heartParticles.scale.set(0, 0, 0); 
    scene.add(heartParticles);

 
    function createElegantText(message) {
      const canvas = document.createElement('canvas');
      canvas.width = 800; canvas.height = 160;
      const ctx = canvas.getContext('2d');
      ctx.font = "italic bold 65px 'Georgia', serif"; 
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = "#ffcc00";
      ctx.shadowBlur = 20;
      ctx.fillStyle = "#ffffff";
      ctx.fillText(message, 400, 80);
      return new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, depthWrite: false }));
    }

    const mainText = createElegantText("Te amo 💛🌻");
    mainText.position.set(0, 4, 0);
    mainText.scale.set(0, 0, 0); 
    scene.add(mainText);

    const orbitGroup = new THREE.Group();
    scene.add(orbitGroup);

    function createSmallTextSprite(message) {
      const canvas = document.createElement('canvas');
      canvas.width = 700; canvas.height = 140;
      const context = canvas.getContext('2d');
      context.font = "bold 45px Arial";
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.fillStyle = "#ffffff";
      context.shadowColor = "#ffaa00";
      context.shadowBlur = 10;
      context.fillText(message, canvas.width / 2, canvas.height / 2);
      return new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, depthWrite: false }));
    }

    const romanticTexts = [
      "Amor de mi vida 💛", "Eres preciosa 🌻", "Me encantas 🌼", "Mi Amor 💛",
      "Eres mi todo 🌻", "Te Amo ☀️", "Siempre juntos 💛", "Eres mi sol 🌻",
      "Eres única 🌼", "Te adoro 💛", "My Love 🌻"
    ];

    const flowerUrls = ["flor1.png", "flor2.png", "flor3.png", "flor4.png", "flor5.png", "flor6.png", "flor7.png"];

    const imageUrls = [
      "4.png",
      "5.png",
      "6.png",
      "7.png",
      "8.png",
    ];

    // Cada girasol lleva su propio mensaje. Se repiten los textos para tener
    // más girasoles orbitando (misma densidad que antes), y se cierra con
    // los 5 ramos especiales que abren una carta al tocarlos.
    const floresConMensaje = [];
    const vueltas = 2;
    for (let v = 0; v < vueltas; v++) {
      romanticTexts.forEach((msg, idx) => {
        floresConMensaje.push({
          img: flowerUrls[(idx + v) % flowerUrls.length],
          msg,
          escala: 1.5
        });
      });
    }
    imageUrls.forEach((url, idx) => {
      floresConMensaje.push({
        img: url,
        msg: 'Toca para ver tu carta 💌',
        escala: 1.9,
        clickeable: true,
        cartaUrl: `carta${idx + 1}.png`
      });
    });

    function crearGirasolConMensaje(item) {
      const grupo = new THREE.Group();

      const tex = getTexture(item.img);
      const florSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
      florSprite.scale.set(item.escala, item.escala, 1);
      florSprite.position.set(0, 0.55, 0);
      florSprite.userData = item.clickeable
        ? { esClickeable: true, tipo: 'imagen', cartaUrl: item.cartaUrl }
        : { esClickeable: true, tipo: 'mensaje', mensaje: item.msg };
      grupo.add(florSprite);

      const etiqueta = createSmallTextSprite(item.msg);
      etiqueta.scale.set(3.4, 0.68, 1);
      etiqueta.position.set(0, -0.75, 0);
      grupo.add(etiqueta);

      return grupo;
    }

    const totalOrbiters = floresConMensaje.length;

    floresConMensaje.forEach((item, i) => {
      const radius = 6.0 + (i % 3) * 0.8;
      const angle = (i / totalOrbiters) * Math.PI * 2;
      const heights = [-2.5, -0.8, 0.8, 2.5];
      const yPos = heights[i % 4] + (Math.random() * 0.4 - 0.2);

      const orbiter = crearGirasolConMensaje(item);
      orbiter.position.set(Math.cos(angle) * radius, yPos, Math.sin(angle) * radius);
      orbitGroup.add(orbiter);
    });
    orbitGroup.scale.set(0, 0, 0);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const modalCarta = document.getElementById('modalCarta');
    const cartaImg = document.getElementById('cartaImg');
    const cerrarModal = document.getElementById('cerrarModal');
    const modalMensaje = document.getElementById('modalMensaje');
    const textoMensaje = document.getElementById('textoMensaje');
    const cerrarMensaje = document.getElementById('cerrarMensaje');
    let isModalOpen = false;

    window.addEventListener('pointerdown', (event) => {
      if(isModalOpen) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(orbitGroup.children, true);

      if (intersects.length > 0) {
        const objetoTocado = intersects[0].object;
        const datos = objetoTocado.userData;

        if (datos && datos.esClickeable) {
          if (datos.tipo === 'imagen') {
            abrirCarta(datos.cartaUrl);
          } else if (datos.tipo === 'mensaje') {
            abrirMensaje(datos.mensaje);
          }
        }
      }
    });

    function abrirCarta(url) {
      cartaImg.src = url;
      modalCarta.classList.add('show');
      isModalOpen = true;
      controls.enabled = false;
    }

    function abrirMensaje(msg) {
      textoMensaje.textContent = msg;
      modalMensaje.classList.add('show');
      isModalOpen = true;
      controls.enabled = false;
    }

    cerrarMensaje.addEventListener('click', () => {
      modalMensaje.classList.remove('show');
      isModalOpen = false;
      if (stage === 3) controls.enabled = true;
    });

    cerrarModal.addEventListener('click', () => {
      modalCarta.classList.remove('show');
      isModalOpen = false;
      setTimeout(() => { cartaImg.src = ""; }, 300); 
      if (stage === 3) controls.enabled = true;
    });


   
    const clock = new THREE.Clock();
    let stage = -1; // -1 = esperando clic inicial en el girasol
    let timeProgress = 0;

    const inicio = document.getElementById('inicio');
    const girasolInicio = document.getElementById('girasolInicio');
    function comenzarGalaxia() {
      if (stage !== -1) return;
      inicio.classList.add('oculto');
      stage = 0;
    }
    girasolInicio.addEventListener('click', (e) => { e.stopPropagation(); comenzarGalaxia(); });
    inicio.addEventListener('click', comenzarGalaxia);

    function easeOutCubic(x) {
      return 1 - Math.pow(1 - x, 3);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1); 
      const time = clock.getElapsedTime();

      comets.forEach(comet => {
        comet.position.add(comet.userData.velocity);
        if (comet.position.y < -200 || Math.abs(comet.position.x) > 300 || Math.abs(comet.position.z) > 300) {
          resetComet(comet);
        }
      });

      if (stage === 0) {
        timeProgress += delta * 0.3; 
        
        const pos = stars.geometry.attributes.position.array;
        for(let i = 2; i < pos.length; i += 3) {
          pos[i] += 25; 
          if(pos[i] > 100) {
            pos[i] = -200; 
            pos[i-1] = (Math.random() - 0.5) * 400;
            pos[i-2] = (Math.random() - 0.5) * 400;
          }
        }
        stars.geometry.attributes.position.needsUpdate = true;

        explFlowers.forEach(sprite => {
          sprite.position.z += 25;
          if (sprite.position.z > 50) {
            sprite.position.z = -200 - Math.random() * 100;
            sprite.position.x = (Math.random() - 0.5) * 150;
            sprite.position.y = (Math.random() - 0.5) * 150;
          }
        });

        explTextos.forEach(sprite => {
          sprite.position.z += 25;
          if (sprite.position.z > 50) {
            sprite.position.z = -200 - Math.random() * 100;
            sprite.position.x = (Math.random() - 0.5) * 150;
            sprite.position.y = (Math.random() - 0.5) * 150;
          }
        });

        actualizarEstelas(25);

        if (timeProgress >= 1) {
          stage = 1;
          timeProgress = 0;
          galaxyGroup.visible = true;
        }
      } 
      else if (stage === 1) {
        timeProgress += delta * 0.5; 
        const scale = easeOutCubic(Math.min(timeProgress, 1));
        
        galaxyGroup.scale.set(scale, scale, scale);

        const speed = 25 * (1 - scale);
        
        const pos = stars.geometry.attributes.position.array;
        for(let i = 2; i < pos.length; i += 3) {
          pos[i] += speed > 0.1 ? speed : 0;
          if(pos[i] > 100) pos[i] = -200;
        }
        stars.geometry.attributes.position.needsUpdate = true;

        explFlowers.forEach(sprite => {
          sprite.position.z += speed > 0.1 ? speed : 0;
          if (sprite.position.z > 50) {
            sprite.position.z = -200 - Math.random() * 100;
            sprite.position.x = (Math.random() - 0.5) * 150;
            sprite.position.y = (Math.random() - 0.5) * 150;
          }
        });

        explTextos.forEach(sprite => {
          sprite.position.z += speed > 0.1 ? speed : 0;
          if (sprite.position.z > 50) {
            sprite.position.z = -200 - Math.random() * 100;
            sprite.position.x = (Math.random() - 0.5) * 150;
            sprite.position.y = (Math.random() - 0.5) * 150;
          }
        });

        actualizarEstelas(speed);

        if (timeProgress >= 1) {
          stage = 2;
          timeProgress = 0;
          textExplosionGroup.visible = false;
          estelas.visible = false;
        }
      }
      else if (stage === 2) {
        timeProgress += delta * 0.8; 
        const scale = easeOutCubic(Math.min(timeProgress, 1));
        
        heartParticles.scale.set(scale, scale, scale);
        orbitGroup.scale.set(scale, scale, scale);
        mainText.scale.set(5 * scale, 1 * scale, 1); 

        explFlowers.forEach(sprite => {
          sprite.position.applyAxisAngle(new THREE.Vector3(0,1,0), 0.001);
        });

        if (timeProgress >= 1) {
          stage = 3;
          if(!isModalOpen) controls.enabled = true; 
        }
      }

      if (!isModalOpen) {
        if (stage >= 1) galaxyGroup.rotation.y += 0.001;
        if (stage >= 2) orbitGroup.rotation.y += 0.001;

        if (stage === 3) {
           stars.rotation.y += 0.0002; 
           
           const pulse = 1 + Math.sin(time * 2.5) * 0.03;
           heartParticles.scale.set(pulse, pulse, pulse);
           heartParticles.position.y = 4 + Math.sin(time) * 0.2;
           mainText.position.y = 4 + Math.sin(time) * 0.2;
           
           explFlowers.forEach(sprite => {
             sprite.position.applyAxisAngle(new THREE.Vector3(0,1,0), 0.001);
           });
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>

</html>
